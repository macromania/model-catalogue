[project]
name = "model-catalogue"
version = "0.1.0"
description = "Database-backed model catalogue and explicit seed program"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "azure-identity>=1.25",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "app/features"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
