name: Bug report
description: Report a reproducible application or workflow problem.
body:
  - type: markdown
    attributes:
      value: "Do not include credentials or deployment state. For security issues, follow SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal example with synthetic data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the commit, operating system, Docker and kind versions.
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove tokens, credentials, account identifiers and private data.
